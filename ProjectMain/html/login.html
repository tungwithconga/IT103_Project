<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="container">
    <div class="left">
      <img src="../image/draw2.webp.png" alt="Illustration" />
    </div>
    <div class="right">
      <div class="form-container">
        <p class="social-text">Sign in with</p>
        <div class="social-buttons">
          <button class="social-btn fb">f</button>
          <button class="social-btn tw">t</button>
          <button class="social-btn in">in</button>
        </div>
        <p class="or">Or</p>
        <form id="loginForm">
          <label>Email address</label>
          <input type="email" id="email" placeholder="Enter a valid email address" />
          <span id="emailError" class="error-message"></span>
        
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" />
          <span id="passwordError" class="error-message"></span>
        
          <span id="loginError" class="error-message"></span>
        
          <button type="submit" class="login-btn">Login</button>
        </form>
        
        <p class="register-text">
          Don't have an account? <a href="./register.html">Register</a>
        </p>
      </div>
    </div>
  </div>
  <footer>
    <p>Copyright © 2025. All rights reserved.</p>
    <div class="social-icons">
      <a href="#">f</a>
      <a href="#">t</a>
      <a href="#">G</a>
      <a href="#">in</a>
    </div>
  </footer>
  <script src="../javascript/login.js"></script>
</body>
</html>
