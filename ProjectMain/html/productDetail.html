<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Detail</title>
  <link rel="stylesheet" href="../css/productDetail.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <div class="post-header">
      <img class="avatar" src="" alt="avatar" id="avatar">
      <div class="post-title" id="postTitle">Loading...</div>
    </div>
    <div class="post-content" id="postContent">Loading...</div>
    <div class="actions">
      <div><i class="fa-regular fa-thumbs-up"></i> <span id="likeCount">0</span> Likes</div>
      <div><i class="fa-regular fa-comment-dots"></i> <span id="commentCount">0</span> Comments</div>
    </div>
    <div class="view-comments">View all comments <i class="fa-solid fa-chevron-down"></i></div>

    <!-- Comments Section -->
    <div id="commentsSection"></div>
    <!-- Bình luận mới -->
    <form id="commentForm" class="comment-form">
      <input type="text" id="commentInput" placeholder="Viết bình luận..." required />
      <button type="submit">Gửi</button>
    </form>
  </div>
  <script src="../javascript/productDetail.js"></script>
</body>
</html>
