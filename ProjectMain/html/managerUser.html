<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management</title>
  <link rel="stylesheet" href="../css/managerUser.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a href="./managerUser.html" class="menu-btn active"><i class="fas fa-users"></i> Quản lý người dùng</a>
      <a href="./managerCategory.html" class="menu-btn"><i class="fas fa-tags"></i> Quản lý danh mục</a>
      <a href="./managerPost.html" class="menu-btn"><i class="fas fa-newspaper"></i> Quản lý bài viết</a>
      <button class="menu-btn logout"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
    </aside>

    <div class="main-wrapper">
      <div class="topbar">
        <div class="spacer"></div>
        <div class="topbar-icons">
          <i class="fas fa-envelope"></i>
          <i class="fas fa-bell"></i>
          <img src="../image/anhtung.jpg" alt="avatar" class="top-avatar" />
        </div>
      </div>

      <main class="main-content">
        <div class="header">
          <h2>Quản lý người dùng <span id="userCount" class="badge">0 người</span></h2>
          <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search user" />
        </div>

        <table class="user-table">
          <thead>
            <tr>
              <th>Tên</th>
              <th>Trạng thái <i class="fas fa-arrow-down"></i></th>
              <th>Địa chỉ email</th>
              <th>Chức năng</th>
              <th id="sortBtn">Sắp xếp theo tên <i class="fas fa-sort"></i></th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- Dữ liệu user sẽ được JS render vào đây -->
          </tbody>
        </table>

        <div class="pagination" id="pagination"></div>
      </main>
    </div>
  </div>

  <script src="../javascript/managerUser.js"></script>
</body>
</html>
